# 内存预算：本沙箱 cgroup 限额 4G，基线进程已占 ~500M——
# Gradle daemon 1792m + Kotlin daemon 1024m + aapt2/KSP 峰值，
# 合计控制在 3.5G 内（2560m 堆在 compileDebugKotlin 必被 OOM kill）
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Kotlin 编译器默认跑在独立 JVM 且不设堆上限，与 Gradle daemon 叠加
# 轻易击穿容器限额；显式限制为 1024m
kotlin.daemon.jvmargs=-Xmx1024m
# 构建性能：并行模块构建 + 任务输出缓存 + 配置缓存
#（旧配置下每次构建都单线程冷启动 configuration 阶段；
#  2048m 堆对 KSP + Compose 编译 + detekt 并跑偏小，易触发 Full GC）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
# Jetifier 已移除：全部依赖均为 AndroidX（kxml2/xmlpull 为纯 Java 测试依赖，
# 无需重写），省去每个第三方构件的重写开销
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
