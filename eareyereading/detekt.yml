# Detekt configuration - replaces default config entirely
# Only potential-bugs rules active (catches real issues, not style noise)

build:
  maxIssues: 50

style:
  active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  UnusedImports:
    active: true
  WildcardImports:
    active: false

complexity:
  active: false
  LongMethod:
    active: false
  TooManyFunctions:
    active: false
  ReturnCount:
    active: false
  LongParameterList:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

potential-bugs:
  active: true
  NullableToStringCall:
    active: true
  UnsafeCast:
    active: true

performance:
  active: false

naming:
  active: false
