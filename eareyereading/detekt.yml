# Detekt configuration - extends defaults, overrides specific rules
# Known valid rule names in detekt 1.23.4

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false

complexity:
  LongMethod:
    active: false
  TooManyFunctions:
    active: false
  ReturnCount:
    active: false
  LongParameterList:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
