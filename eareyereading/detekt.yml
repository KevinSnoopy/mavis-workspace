# Detekt configuration for EareyeReading
# Run: ./gradlew :app:detekt
# Minimal config - extends detekt defaults

style:
  MagicNumber:
    ignoreAnnotation: ['Composable', 'Inject', 'Singleton']
  MaxLineLength:
    maxLineLength: 180

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
