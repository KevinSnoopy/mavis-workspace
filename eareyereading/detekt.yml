# Detekt configuration - disable noisy style/complexity rules
# Android/Compose code naturally has many parameters, long functions, and numeric literals

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  UnusedImports:
    active: true
  WildcardImports:
    active: false

complexity:
  LongMethod:
    active: false
  TooManyFunctions:
    active: false
  ReturnCount:
    active: false
  LongParameterList:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
