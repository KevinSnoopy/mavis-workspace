# Detekt configuration for EareyeReading Android project
# Run: ./gradlew :app:detekt

config:
  validation: true
  excludes:
    - '**/build/**'
    - '**/.gradle/**'
    - '**/generated/**'

build:
  maxIssues: 0

style:
  active: true
  ReturnCount:
    active: true
    max: 4
  MagicNumber:
    active: true
    ignoreAnnotation: ['Composable', 'Inject', 'Singleton']
    ignoreNumbers: ['-1', '0', '1', '2', '100', '1000', '3600', '60000', '0.5', '0.85', '0.3']
  MaxLineLength:
    active: true
    maxLineLength: 180
  UnusedImports:
    active: true
  WildcardImports:
    active: true
    excludes: ['**/test/**', '**/*.test.kt']

complexity:
  active: true
  LongParameterList:
    active: true
    threshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 25
    thresholdInClasses: 20
    thresholdInInterfaces: 12
  ComplexMethod:
    active: true
    threshold: 20
    ignoreSingleWhenExpression: true
    ignoreNestingFunctions: true
  NestedBlockDepth:
    active: true
    maxDepth: 5

potential-bugs:
  active: true
  NullableToStringCall:
    active: true
  UnconditionalIfStatement:
    active: true
  UnsafeCast:
    active: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
    excludeAnnotatedFunctions: ['Composable']

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)'
    excludeAnnotatedFunctions: ['Composable', 'Inject']
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'
