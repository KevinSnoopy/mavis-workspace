# Detekt configuration - replaces default config (buildUponDefaultConfig=false)
# Only potential-bugs rules enabled (catches real bugs)

build:
  maxIssues: 0

potential-bugs:
  active: true
  NullableToStringCall:
    active: true
  UnsafeCast:
    active: true

# All style/complexity rules disabled
style:
  active: false
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  UnusedImports:
    active: false
  ReturnCount:
    active: false

complexity:
  active: false
  LongMethod:
    active: false
  TooManyFunctions:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: false
  LargeClass:
    active: false

performance:
  active: false

naming:
  active: false
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false
