<?xml version="1.0" encoding="utf-8"?>
<!--
  听阅 EareyeReading — App Icon 主源文件
  ============================================================
  概念：「眸中之页」— 两片书页合成杏仁形眼廓，中缝即书脊，
        中心瞳孔点破「阅」的语义。远看是眼，近看是书。

  几何规格（108dp 画布 / Android Adaptive Icon）
  ····························································
  · 杏仁眼廓：宽 60dp (x 24→84)，高 44dp (y 31→75)，中心 (54, 53)
  · 书脊中缝：3.2dp（左右页内边距 52.4 / 55.6）
  · 瞳孔：直径 12dp (r=6)，圆心 (54, 53)
  · 安全区：内容完全落在中心 72dp 安全圆内，
           可承受圆形 / 圆角方形 / 水滴等任意厂商裁切

  小尺寸退化策略（关键）
  ····························································
  48dp 显示时缩放比 44%：
    杏仁高 44dp → 19dp  ✔ 主轮廓清晰
    中缝 3.2dp  → 1.4dp ✔ 仍可辨识
    瞳孔 12dp   → 5.3dp ✔ 清晰（更精致，去除大瞳孔带来的「惊讶」感）
  刻意不设文字行等细节，它们在此比例下必然糊成噪点。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <defs>
    <!-- 墨绿对角渐变：primary-500 → primary-700 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0E6B5E"/>
      <stop offset="100%" stop-color="#0B473F"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="108" height="108" fill="url(#bg)"/>

  <!-- 左页：杏仁左半弧 + 书脊侧直边 -->
  <path fill="#F1FCFA"
        d="M54,31
           C42,31 24,39.5 24,53
           C24,66.5 42,75 54,75
           L52.4,75
           L52.4,31
           Z"/>

  <!-- 右页：镜像 -->
  <path fill="#F1FCFA"
        d="M54,31
           C66,31 84,39.5 84,53
           C84,66.5 66,75 54,75
           L55.6,75
           L55.6,31
           Z"/>

  <!-- 瞳孔：取渐变中心色，视觉上等同于挖空透底 -->
  <circle cx="54" cy="53" r="6" fill="#0D594F"/>
</svg>
