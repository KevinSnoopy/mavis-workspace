name: Code Quality Check

on:
  push:
    branches: [eareyereading, main]
  pull_request:
    branches: [eareyereading, main]
  workflow_dispatch:

jobs:
  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Run Detekt
        run: cd eareyereading && chmod +x gradlew && ./gradlew detekt --no-daemon
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v2
        if: success()
        with:
          sarif_file: eareyereading/app/build/reports/detekt.sarif
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: detekt-report
          path: eareyereading/app/build/reports/detekt.html
