name: Build Debug APK

on:
  push:
    branches: [eareyereading]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (eareyereading branch)
        uses: actions/checkout@v4
        with:
          ref: eareyereading
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform-34 / build-tools 34.0.0 / platform-tools)
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Make gradlew executable
        working-directory: eareyereading
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: eareyereading
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apks
          path: eareyereading/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
