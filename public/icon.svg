<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e85d4c"/>
      <stop offset="100%" style="stop-color:#c94a3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- 天平图标 -->
  <g transform="translate(256, 280)" filter="url(#shadow)">
    <!-- 支撑柱 -->
    <rect x="-8" y="-80" width="16" height="160" rx="8" fill="white"/>
    
    <!-- 横梁 -->
    <rect x="-140" y="-80" width="280" height="20" rx="10" fill="white"/>
    
    <!-- 左盘 -->
    <path d="M-130,-60 L-50,-60 L-60,-20 L-120,-20 Z" fill="white" opacity="0.9"/>
    <circle cx="-90" cy="-70" r="24" fill="#ffd93d"/>
    
    <!-- 右盘 -->
    <path d="M50,-60 L130,-60 L120,-20 L60,-20 Z" fill="white" opacity="0.9"/>
    <circle cx="90" cy="-70" r="24" fill="#4ade80"/>
    
    <!-- 底座 -->
    <path d="M-60,80 L60,80 L40,60 L-40,60 Z" fill="white" opacity="0.9"/>
    <rect x="-80" y="80" width="160" height="20" rx="4" fill="white"/>
  </g>
</svg>
